---

- hosts: monitored
  become: true
  ignore_errors: false
  vars_files:
    - vars.yml

  tasks:
    - name: Download the Datadog Agent 7 install script
      ansible.builtin.get_url:
        url: "{{ dd_script_url }}"
        dest: "{{ dd_script_path }}"
        mode: "0755"

    - name: Install the Datadog Agent
      ansible.builtin.command: "{{ dd_script_path }}"
      environment:
        DD_API_KEY: "{{ dd_api_key }}"
        DD_SITE: "{{ dd_site }}"
        DD_ENV: "{{ dd_env }}"
        DD_HOSTNAME: "{{ dd_hostname }}"
      args:
        creates: "{{ dd_config_file }}"
      no_log: true

    - name: Ensure the Datadog Agent is enabled and running
      ansible.builtin.systemd_service:
        name: "{{ dd_service_name }}"
        state: started
        enabled: true

    - name: Wait until the agent reports healthy
      ansible.builtin.command: datadog-agent health
      register: dd_health
      until: dd_health.rc == 0
      retries: "{{ dd_health_retries }}"
      delay: "{{ dd_health_delay }}"
      changed_when: false

    - name: Show agent health
      ansible.builtin.debug:
        msg: "{{ dd_hostname }} → {{ dd_health.stdout_lines | first }}"