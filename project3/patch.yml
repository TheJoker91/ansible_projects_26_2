---
- hosts: monitored
  become: true
  ignore_errors: false
  vars_files:
    - vars.yml

  tasks:
    # RedHat / CentOS / Amazon Linux
    - name: Patch RedHat family servers
      when: ansible_os_family == "RedHat"
      block:
        - name: List available security advisories
          ansible.builtin.command: dnf updateinfo list --security
          register: rh_advisories
          changed_when: false

        - name: Show available security advisories
          ansible.builtin.debug:
            msg: "{{ rh_advisories.stdout_lines | default(['None']) }}"

        - name: Upgrade to the latest AL2023 release with security updates
          ansible.builtin.command: dnf upgrade --releasever=latest --security -y
          register: rh_release_upgrade
          changed_when: "'Nothing to do' not in rh_release_upgrade.stdout"
          when:
            - patch_releasever_latest | bool
            - ansible_distribution == "Amazon"

        - name: Apply updates
          ansible.builtin.dnf:
            name: "*"
            state: latest
            security: "{{ patch_security_only }}"
            exclude: "{{ patch_exclude_packages }}"
            update_cache: true
          register: rh_patch

        - name: Check if a reboot is required
          ansible.builtin.command: dnf needs-restarting -r
          register: rh_reboot_check
          changed_when: false
          failed_when: rh_reboot_check.rc not in [0, 1]

        - name: Verify no security updates remain
          ansible.builtin.command: dnf check-update --security
          register: rh_remaining
          changed_when: false
          failed_when: rh_remaining.rc not in [0, 100]

    # Debian / Ubuntu
    - name: Patch Debian family servers
      when: ansible_os_family == "Debian"
      block:
        - name: Update apt cache
          ansible.builtin.apt:
            update_cache: true
            cache_valid_time: "{{ patch_apt_cache_valid_time }}"

        - name: Install unattended-upgrades
          ansible.builtin.apt:
            name: unattended-upgrades
            state: present
          when: patch_install_unattended_upgrades | bool

        - name: Apply security updates only
          ansible.builtin.command: unattended-upgrade -v
          register: deb_security_patch
          changed_when: "'No packages found that can be upgraded' not in deb_security_patch.stdout"
          when: patch_security_only | bool

        - name: Apply all updates
          ansible.builtin.apt:
            upgrade: "yes"
          register: deb_full_patch
          when: not (patch_security_only | bool)

        - name: Check if a reboot is required
          ansible.builtin.stat:
            path: /var/run/reboot-required
          register: deb_reboot_check

        - name: Verify remaining upgradable packages
          ansible.builtin.command: apt list --upgradable
          register: deb_remaining
          changed_when: false

    # Reboot (only when required)
    - name: Decide whether a reboot is needed
      ansible.builtin.set_fact:
        patch_reboot_needed: >-
          {{ (rh_reboot_check.rc | default(0)) == 1
             or (deb_reboot_check.stat.exists | default(false)) }}

    - name: Reboot the server
      ansible.builtin.reboot:
        msg: "{{ patch_reboot_msg }}"
        reboot_timeout: "{{ patch_reboot_timeout }}"
      when:
        - patch_reboot_needed | bool
        - patch_allow_reboot | bool

    # Patch report (compliance record)
    - name: Create the patch report directory
      ansible.builtin.file:
        path: "{{ patch_report_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Write the patch report
      ansible.builtin.copy:
        dest: "{{ patch_report_dir }}/patch_{{ ansible_date_time.date }}.log"
        owner: root
        group: root
        mode: "0640"
        content: |
          Host:            {{ inventory_hostname }}
          Date (UTC):      {{ ansible_date_time.iso8601 }}
          OS:              {{ ansible_distribution }} {{ ansible_distribution_version }}
          Security only:   {{ patch_security_only }}
          Packages changed: {{ (rh_patch.changed | default(false)) or (deb_security_patch.changed | default(false)) or (deb_full_patch.changed | default(false)) }}
          Reboot required: {{ patch_reboot_needed }}
          Remaining security updates (RedHat rc 0 = none): {{ rh_remaining.rc | default('n/a') }}

    - name: Show patch summary
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Packages changed: {{ (rh_patch.changed | default(false)) or (deb_security_patch.changed | default(false)) or (deb_full_patch.changed | default(false)) }}"
          - "Reboot required: {{ patch_reboot_needed }}"
          - "Rebooted: {{ (patch_reboot_needed | bool) and (patch_allow_reboot | bool) }}"