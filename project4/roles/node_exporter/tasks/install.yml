---
- name: Create the service group
  ansible.builtin.group:
    name: "{{ node_exporter_user }}"
    system: true
    state: present

- name: Create the service user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Create the install directory
  ansible.builtin.file:
    path: "{{ node_exporter_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download node exporter and verify its checksum
  ansible.builtin.get_url:
    url: "{{ node_exporter_download_url }}"
    dest: "/tmp/{{ node_exporter_archive }}.tar.gz"
    checksum: "sha256:{{ node_exporter_checksum_url }}"
    mode: "0644"

- name: Extract the archive
  ansible.builtin.unarchive:
    src: "/tmp/{{ node_exporter_archive }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/{{ node_exporter_archive }}/node_exporter"

- name: Install the binary
  ansible.builtin.copy:
    src: "/tmp/{{ node_exporter_archive }}/node_exporter"
    dest: "{{ node_exporter_install_dir }}/node_exporter"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart node exporter

- name: Deploy the systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: "/etc/systemd/system/{{ node_exporter_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart node exporter

- name: Enable and start the service
  ansible.builtin.systemd_service:
    name: "{{ node_exporter_service_name }}"
    state: started
    enabled: true
    daemon_reload: true

- name: Apply pending restarts now
  ansible.builtin.meta: flush_handlers

- name: Wait for the port to open
  ansible.builtin.wait_for:
    port: "{{ node_exporter_port }}"
    timeout: 30

- name: Check the metrics endpoint
  ansible.builtin.uri:
    url: "http://localhost:{{ node_exporter_port }}/metrics"
    return_content: true
  register: node_exporter_metrics

- name: Confirm the expected version is running
  ansible.builtin.assert:
    that:
      - "'version=\"' ~ node_exporter_version ~ '\"' in node_exporter_metrics.content"
    success_msg: "{{ node_exporter_service_name }} v{{ node_exporter_version }} is serving metrics on :{{ node_exporter_port }}"
    fail_msg: "{{ node_exporter_service_name }} is not running v{{ node_exporter_version }}"